name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # only the release step on a v* tag needs it

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build-app.sh takes the version from git tags

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
          sw_vers

      - name: Build afsctool from source
        run: |
          ./scripts/build-afsctool.sh
          echo "SQUEEZE_AFSCTOOL=$PWD/build/afsctool/afsctool" >> "$GITHUB_ENV"
          # make sure nothing below silently uses a Homebrew copy instead
          if command -v afsctool; then echo "a Homebrew afsctool is on PATH"; exit 1; fi

      - name: Shell syntax
        run: |
          for f in scripts/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: Unit tests
        run: swift test

      - name: Steam script on a fake library
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/steam"
          GAME="$ROOT/steamapps/common/Test Game"
          mkdir -p "$GAME/data"
          cat > "$ROOT/steamapps/appmanifest_999.acf" <<'EOF'
          "AppState"
          {
              "appid"        "999"
              "name"         "Test Game"
              "StateFlags"   "4"
              "installdir"   "Test Game"
          }
          EOF
          # 8 MB of zeros compresses to almost nothing
          for i in 1 2 3 4; do head -c 2097152 /dev/zero > "$GAME/data/file$i.bin"; done
          export SQUEEZE_STEAM_ROOT="$ROOT" SQUEEZE_LOG="$RUNNER_TEMP/squeeze.log"

          echo "--- list (before)"
          ./scripts/squeeze-steam.sh --list

          echo "--- compress"
          ./scripts/squeeze-steam.sh --app 999 --force
          cat "$SQUEEZE_LOG"

          echo "--- flags after"
          ls -lO "$GAME/data"
          compressed=$(find "$GAME" -type f -flags +compressed | wc -l | tr -d ' ')
          echo "compressed files: $compressed"
          [ "$compressed" = 4 ] || { echo "expected 4 compressed files"; exit 1; }

          echo "--- list (after)"
          ./scripts/squeeze-steam.sh --list | tee "$RUNNER_TEMP/list.txt"
          grep -q "compressed 100%" "$RUNNER_TEMP/list.txt"

          echo "--- contents unchanged"
          for i in 1 2 3 4; do
            [ "$(stat -f %z "$GAME/data/file$i.bin")" = 2097152 ]
            cmp "$GAME/data/file$i.bin" <(head -c 2097152 /dev/zero)
          done

          echo "--- a game that Steam is updating is skipped"
          echo "new data" > "$GAME/data/new.txt"
          sed -i '' 's/"StateFlags".*/"StateFlags"   "1026"/' "$ROOT/steamapps/appmanifest_999.acf"
          ./scripts/squeeze-steam.sh --app 999 --force | tee "$RUNNER_TEMP/busy.txt"
          grep -q "skipped" "$RUNNER_TEMP/busy.txt"
          [ -z "$(find "$GAME/data/new.txt" -flags +compressed)" ]

      - name: Build app (Apple Silicon + Intel)
        env:
          UNIVERSAL: "1"
        run: ./scripts/build-app.sh

      - name: Check the app bundle
        run: |
          set -euo pipefail
          APP=dist/Squeeze.app
          ls -la dist
          find "$APP" -type f | sort
          for bin in "$APP/Contents/MacOS/Squeeze" "$APP/Contents/Helpers/afsctool"; do
            archs=$(lipo -archs "$bin"); echo "$bin: $archs"
            [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]
          done
          test -s "$APP/Contents/Resources/ThirdParty/afsctool/SOURCE.txt"
          ls "$APP/Contents/Resources/ThirdParty/afsctool/licenses" | grep -q .
          codesign --verify --deep --strict "$APP"
          plutil -lint "$APP/Contents/Info.plist"

      - name: Bundled afsctool works from the unzipped release
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/release"; mkdir -p "$T"
          ditto -x -k dist/Squeeze-*.zip "$T"
          head -c 4194304 /dev/zero > "$T/sample.bin"
          "$T/Squeeze.app/Contents/Helpers/afsctool" -c -T LZFSE "$T/sample.bin"
          ls -lO "$T/sample.bin"
          [ -n "$(find "$T/sample.bin" -flags +compressed)" ]
          # the Steam script finds the copy inside an installed app on its own
          mkdir -p "$HOME/Applications" && cp -R "$T/Squeeze.app" "$HOME/Applications/"
          ROOT="$RUNNER_TEMP/steam2"; mkdir -p "$ROOT/steamapps"
          env -u SQUEEZE_AFSCTOOL SQUEEZE_STEAM_ROOT="$ROOT" SQUEEZE_LOG="$RUNNER_TEMP/s2.log" ./scripts/squeeze-steam.sh --list

      - uses: actions/upload-artifact@v4
        with:
          name: Squeeze-app
          path: dist/Squeeze-*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 0.x versions are marked as pre-releases
          pre=(); [[ "$GITHUB_REF_NAME" == v0.* ]] && pre=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/Squeeze-*.zip \
            --title "Squeeze ${GITHUB_REF_NAME#v}" \
            --generate-notes ${pre[@]+"${pre[@]}"}
